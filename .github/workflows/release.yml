name: Publish standalone HTML app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare standalone HTML app
        shell: bash
        run: |
          mkdir -p dist
          version="${GITHUB_REF_NAME#v}"
          if [ "$version" = "$GITHUB_REF_NAME" ]; then version="$(node -p "require('./package.json').version")"; fi
          cp index.html "dist/Simple.MindMap-${version}.html"
      - name: Upload standalone HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: standalone-html
          path: dist/*.html
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.html
          generate_release_notes: true
