name: Build Windows desktop app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build installer and portable exe
        run: npx electron-builder --win --publish never
      - name: Add standalone HTML app
        run: node -e "const fs=require('fs'),p=require('./package.json');fs.copyFileSync('index.html','dist/Simple.Mindmap-'+p.version+'.html')"
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-build
          path: |
            dist/*.exe
            dist/*.html
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.html
          generate_release_notes: true
