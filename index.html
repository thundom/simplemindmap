<title>Simple Mindmap</title>
<style>
  :root {
    --bg: #f3f5f6;
    --surface: #ffffff;
    --ink: #22303c;
    --ink-soft: #5b6b78;
    --line: #c6cfd6;
    --edge: #9fb0bc;
    --accent: #0e7c7b;
    --danger: #b3382e;
    --notice: #b26a2b;
    --root-bg: #22303c;
    --root-ink: #f3f5f6;
    --shadow: 0 1px 3px rgba(34, 48, 60, 0.12);
    --c-teal: #0e7c7b;
    --c-blue: #2f6db4;
    --c-indigo: #4a5899;
    --c-steel: #2b7a94;
    --c-green: #557a46;
    --c-orange: #b26a2b;
    --c-coral: #b3463c;
    --c-plum: #96496b;
    --c-purple: #7d5ba6;
    --c-slate: #5b6b78;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171e24;
      --surface: #212a33;
      --ink: #dde5ea;
      --ink-soft: #93a3af;
      --line: #3a4750;
      --edge: #4d5d68;
      --accent: #3aa8a0;
      --danger: #d4695f;
      --notice: #d1934f;
      --root-bg: #dde5ea;
      --root-ink: #171e24;
      --shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
      --c-teal: #3aa8a0; --c-blue: #6ba3dd; --c-indigo: #8b97d6; --c-steel: #62aec6;
      --c-green: #86a878; --c-orange: #d1934f; --c-coral: #d97a6f; --c-plum: #c07a9d;
      --c-purple: #a98fd0; --c-slate: #93a3af;
    }
  }
  :root[data-theme="dark"] {
    --bg: #171e24; --surface: #212a33; --ink: #dde5ea; --ink-soft: #93a3af;
    --line: #3a4750; --edge: #4d5d68; --accent: #3aa8a0; --danger: #d4695f;
    --notice: #d1934f;
    --root-bg: #dde5ea; --root-ink: #171e24; --shadow: 0 1px 3px rgba(0,0,0,0.4);
    --c-teal: #3aa8a0; --c-blue: #6ba3dd; --c-indigo: #8b97d6; --c-steel: #62aec6;
    --c-green: #86a878; --c-orange: #d1934f; --c-coral: #d97a6f; --c-plum: #c07a9d;
    --c-purple: #a98fd0; --c-slate: #93a3af;
  }
  :root[data-theme="light"] {
    --bg: #f3f5f6; --surface: #ffffff; --ink: #22303c; --ink-soft: #5b6b78;
    --line: #c6cfd6; --edge: #9fb0bc; --accent: #0e7c7b; --danger: #b3382e;
    --notice: #b26a2b;
    --root-bg: #22303c; --root-ink: #f3f5f6; --shadow: 0 1px 3px rgba(34,48,60,0.12);
    --c-teal: #0e7c7b; --c-blue: #2f6db4; --c-indigo: #4a5899; --c-steel: #2b7a94;
    --c-green: #557a46; --c-orange: #b26a2b; --c-coral: #b3463c; --c-plum: #96496b;
    --c-purple: #7d5ba6; --c-slate: #5b6b78;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  .app { display: flex; flex-direction: column; height: 100vh; }

  /* ---------- top notice strips ---------- */
  .strip {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 8px 20px;
    font-size: 12.5px; line-height: 1.5;
  }
  .strip[hidden] { display: none; }
  .strip b { font-weight: 650; }
  #roBar {
    background: color-mix(in srgb, var(--notice) 16%, var(--surface));
    border-bottom: 1px solid color-mix(in srgb, var(--notice) 45%, var(--line));
    color: var(--ink);
  }
  #webNote {
    background: color-mix(in srgb, var(--accent) 9%, var(--surface));
    border-bottom: 1px solid color-mix(in srgb, var(--accent) 32%, var(--line));
    color: var(--ink-soft);
  }
  #webNote b { color: var(--ink); }

  /* ---------- toolbar ---------- */
  .bar {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 12px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  .bar h1 { font-size: 16px; margin: 0; font-weight: 650; letter-spacing: 0.01em; }
  .bar .sub { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .grow { flex: 1; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .btn {
    font: inherit; font-size: 13px;
    padding: 6px 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
  }
  .btn[hidden] { display: none; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.08); color: #fff; }
  .btn.danger:hover { border-color: var(--danger); color: var(--danger); }
  .btn.on { background: color-mix(in srgb, var(--accent) 14%, var(--surface)); border-color: var(--accent); color: var(--accent); }
  .btn.sm { font-size: 11.5px; padding: 3px 8px; }
  .sep { width: 1px; height: 22px; background: var(--line); }

  .hint {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    font-size: 12px; color: var(--ink-soft);
    padding: 7px 20px;
    border-bottom: 1px solid var(--line); background: var(--surface);
  }
  .hint[hidden] { display: none; }
  .hint b { font-weight: 600; color: var(--ink); }

  /* ---------- share panel ---------- */
  #sharePanel {
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  #shareUrl {
    flex: 1; min-width: 220px;
    font: inherit; font-size: 12px;
    font-family: ui-monospace, Consolas, "Courier New", monospace;
    padding: 5px 9px;
    border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg); color: var(--ink);
  }
  #shareSize { font-size: 11.5px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

  /* ---------- color palette ---------- */
  .pal { display: flex; align-items: center; gap: 7px; }
  .pal .pal-label { font-size: 12px; color: var(--ink-soft); }
  .sw {
    width: 20px; height: 20px; padding: 0;
    border-radius: 50%;
    border: 2px solid var(--surface);
    box-shadow: 0 0 0 1px var(--line);
    background: var(--sc);
    cursor: pointer;
  }
  .sw:hover { box-shadow: 0 0 0 2px var(--sc); }
  .sw.cur { box-shadow: 0 0 0 2px var(--ink); }
  .sw:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sw-clear {
    font: inherit; font-size: 11.5px;
    padding: 2px 8px;
    border: 1px dashed var(--line); border-radius: 10px;
    background: var(--surface); color: var(--ink-soft);
    cursor: pointer;
  }
  .sw-clear:hover { color: var(--accent); border-color: var(--accent); }
  .sw-clear.cur { border-style: solid; border-color: var(--ink); color: var(--ink); }

  /* ---------- body split ---------- */
  .body { display: flex; flex: 1; min-height: 0; }

  /* ---------- saved-document drawer ---------- */
  .drawer {
    width: 272px; flex: none;
    display: flex; flex-direction: column;
    background: var(--surface);
    border-right: 1px solid var(--line);
    transition: margin-left 0.25s ease, opacity 0.25s ease;
  }
  .drawer.closed { margin-left: -272px; opacity: 0; pointer-events: none; }
  @media (prefers-reduced-motion: reduce) { .drawer { transition: none; } }
  .drawer-head {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 14px 10px;
    border-bottom: 1px solid var(--line);
  }
  .drawer-head h2 { font-size: 13px; margin: 0; font-weight: 650; }
  /* the note sits at the TOP of the drawer so it is read before saving */
  .drawer-note {
    margin: 0; padding: 10px 14px;
    font-size: 11.5px; line-height: 1.55; color: var(--ink-soft);
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .folder-label { font-weight: 650; color: var(--ink); }
  .folder-path {
    display: block; margin: 3px 0 7px;
    font-family: ui-monospace, Consolas, "Courier New", monospace;
    font-size: 11px; color: var(--ink);
    overflow-wrap: anywhere;
  }
  .folder-acts { display: flex; gap: 6px; flex-wrap: wrap; }
  .doc-list { list-style: none; margin: 0; padding: 8px; overflow-y: auto; flex: 1; }
  .doc {
    padding: 8px 10px; margin-bottom: 6px;
    border: 1px solid var(--line); border-radius: 7px;
    background: var(--bg);
    cursor: pointer;
  }
  .doc:hover { border-color: var(--accent); }
  .doc.active { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--surface)); }
  .doc-name { font-size: 13px; font-weight: 600; overflow-wrap: break-word; }
  .doc-name[contenteditable="true"] { outline: none; border-bottom: 1px dashed var(--accent); cursor: text; }
  .doc-meta {
    display: flex; align-items: center; gap: 8px;
    font-size: 11px; color: var(--ink-soft); margin-top: 3px;
    font-variant-numeric: tabular-nums;
  }
  .doc-acts { display: flex; gap: 6px; margin-left: auto; }
  .doc-act {
    font: inherit; font-size: 11px; padding: 0 5px;
    border: 1px solid transparent; border-radius: 4px;
    background: none; color: var(--ink-soft); cursor: pointer;
  }
  .doc-act:hover { color: var(--accent); border-color: var(--accent); }
  .doc-act.del:hover { color: var(--danger); border-color: var(--danger); }
  .empty { padding: 18px 12px; font-size: 12px; color: var(--ink-soft); text-align: center; line-height: 1.6; }

  /* ---------- canvas ---------- */
  .canvas { flex: 1; overflow: auto; padding: 48px 64px; }
  #tree { width: max-content; }

  /* ---------- tree layout & connectors ---------- */
  .row { display: flex; align-items: center; }
  .kids { display: flex; flex-direction: column; margin-left: 26px; }
  .branch {
    display: flex; align-items: center; position: relative;
    padding: 5px 0 5px 34px;
    --lc: color-mix(in srgb, var(--bc, var(--edge)) 65%, var(--line));
  }
  /* middle child: straight stub + full-height trunk (T junction) */
  .branch::before {
    content: ""; position: absolute; left: 0; top: 50%;
    width: 34px; border-top: 2px solid var(--lc);
  }
  .branch::after {
    content: ""; position: absolute; left: 0; top: 0; height: 100%;
    border-left: 2px solid var(--lc);
  }
  /* first child: rounded elbow curving down into the trunk */
  .branch:first-child::before {
    height: 50%;
    border-left: 2px solid var(--lc);
    border-top-left-radius: 14px;
  }
  .branch:first-child::after { display: none; }
  /* last child: rounded elbow curving up into the trunk */
  .branch:last-child::before {
    top: 0; height: 50%;
    border-top: none;
    border-bottom: 2px solid var(--lc);
    border-left: 2px solid var(--lc);
    border-bottom-left-radius: 14px;
  }
  .branch:last-child::after { display: none; }
  /* only child: one straight line, no trunk */
  .branch:only-child::before {
    top: 50%; height: 0;
    border: none; border-top: 2px solid var(--lc);
    border-radius: 0;
  }

  /* ---------- mirrored (left-of-root) subtrees ---------- */
  .mirror .row { flex-direction: row-reverse; }
  .kids.mirror, .mirror .kids { margin-left: 0; margin-right: 26px; }
  .mirror .branch { padding: 5px 34px 5px 0; }
  .mirror .branch::before { left: auto; right: 0; }
  .mirror .branch::after {
    left: auto; right: 0;
    border-left: none; border-right: 2px solid var(--lc);
  }
  .mirror .branch:first-child::before {
    border-left: none; border-right: 2px solid var(--lc);
    border-top-left-radius: 0; border-top-right-radius: 14px;
  }
  .mirror .branch:last-child::before {
    border-left: none; border-right: 2px solid var(--lc);
    border-bottom-left-radius: 0; border-bottom-right-radius: 14px;
  }
  .mirror .branch:only-child::before { border: none; border-top: 2px solid var(--lc); border-radius: 0; }

  /* ---------- node card ---------- */
  .card {
    position: relative;
    display: flex; align-items: center; gap: 8px;
    max-width: 340px;
    padding: 7px 12px;
    background: color-mix(in srgb, var(--bc, var(--edge)) 7%, var(--surface));
    border: 1px solid color-mix(in srgb, var(--bc, var(--edge)) 45%, var(--line));
    border-left: 4px solid var(--bc, var(--edge));
    border-radius: 7px;
    box-shadow: var(--shadow);
    font-size: 13.5px;
    line-height: 1.45;
    cursor: grab;
    user-select: none;
  }
  body.ro .card { cursor: default; }
  /* stub from a parent card out to its children's trunk */
  .card.open::after {
    content: ""; position: absolute; right: -26px; top: 50%;
    width: 26px;
    border-top: 2px solid color-mix(in srgb, var(--bc, var(--edge)) 65%, var(--line));
  }
  .mirror .card { flex-direction: row-reverse; border-left-width: 1px; border-right: 4px solid var(--bc, var(--edge)); }
  .mirror .card.open::after { right: auto; left: -26px; }
  .mirror .card .ops { right: auto; left: -8px; }
  .card.depth-1 { font-weight: 650; font-size: 14px; }
  .card.root {
    background: var(--root-bg); color: var(--root-ink);
    border-color: var(--root-bg);
    font-size: 16px; font-weight: 700;
    padding: 12px 18px; max-width: 260px;
    cursor: pointer;
  }
  /* root's stub out to a left-hand subtree */
  .card.open-left::before {
    content: ""; position: absolute; left: -26px; top: 50%;
    width: 26px; border-top: 2px solid var(--edge);
  }
  .card.selected { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card.dragging { opacity: 0.4; cursor: grabbing; }
  .card .txt { min-width: 0; overflow-wrap: break-word; }
  .card .txt[contenteditable="true"] {
    cursor: text; user-select: text; outline: none;
    border-bottom: 1px dashed var(--accent);
  }

  /* drop-zone feedback */
  .dz { position: absolute; display: none; background: var(--accent); border-radius: 2px; }
  .card.dz-before .dz { display: block; left: 0; right: 0; top: -3px; height: 3px; }
  .card.dz-after  .dz { display: block; left: 0; right: 0; bottom: -3px; height: 3px; }
  .card.dz-child { outline: 2px dashed var(--accent); outline-offset: 3px; }
  .card.dz-side-left  .dz { display: block; top: -3px; bottom: -3px; left: -3px; width: 3px; }
  .card.dz-side-right .dz { display: block; top: -3px; bottom: -3px; right: -3px; width: 3px; }

  .toggle {
    flex: none;
    min-width: 20px; height: 20px; padding: 0 5px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600;
    border: 1px solid color-mix(in srgb, var(--bc, var(--edge)) 55%, var(--line));
    border-radius: 10px;
    background: var(--surface); color: var(--ink-soft);
    cursor: pointer;
  }
  .toggle:hover { color: var(--accent); border-color: var(--accent); }
  .card.root .toggle { background: transparent; color: var(--root-ink); border-color: color-mix(in srgb, var(--root-ink) 40%, transparent); }

  .card .ops {
    position: absolute; top: -11px; right: -8px;
    display: none; gap: 4px;
  }
  .card:hover .ops { display: flex; }
  body.ro .card .ops { display: none !important; }
  .op {
    width: 20px; height: 20px;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; line-height: 1;
    border: 1px solid var(--line); border-radius: 50%;
    background: var(--surface); color: var(--ink-soft);
    cursor: pointer; box-shadow: var(--shadow);
  }
  .op:hover { color: var(--accent); border-color: var(--accent); }
  .op.del:hover { color: var(--danger); border-color: var(--danger); }

  /* ---------- toast ---------- */
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--root-bg); color: var(--root-ink);
    padding: 9px 18px; border-radius: 8px;
    font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    opacity: 0; pointer-events: none; transition: opacity 0.25s;
    max-width: 80vw; text-align: center; z-index: 50;
  }
  #toast.show { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { #toast { transition: none; } }

  /* ---------- print document ---------- */
  #printDoc { display: none; }
  @media print {
    .app, #toast { display: none !important; }
    body { background: #fff; color: #1c2530; }
    #printDoc { display: block; font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
    @page { size: A4; margin: 12mm 12mm 14mm; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

    .p-head { border-bottom: 3px solid #22303c; padding-bottom: 10px; margin-bottom: 16px; }
    .p-title { font-size: 23pt; font-weight: 700; margin: 0 0 6px; letter-spacing: 0.01em; }
    .p-meta { font-size: 9pt; color: #5b6b78; display: flex; gap: 18px; }

    .p-sec { margin: 14pt 0 0; break-inside: avoid-page; }
    .p-sec + .p-sec { margin-top: 18pt; }
    .p-h1 {
      font-size: 14pt; font-weight: 700; margin: 0 0 6pt;
      padding: 4pt 8pt; border-left: 5px solid var(--pc, #0e7c7b);
      background: color-mix(in srgb, var(--pc, #0e7c7b) 8%, #fff);
    }
    .p-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4pt 18pt; align-items: start; }
    .p-sub { break-inside: avoid; padding: 3pt 0; }
    .p-h2 {
      font-size: 10.5pt; font-weight: 650; margin: 0 0 2pt;
      display: flex; align-items: baseline; gap: 6px;
    }
    .p-h2::before { content: ""; flex: none; width: 7px; height: 7px; background: var(--pc, #0e7c7b); align-self: center; }
    .p-ul { margin: 0; padding-left: 16pt; font-size: 9.5pt; line-height: 1.55; color: #333d47; }
    .p-ul .p-ul { font-size: 9pt; padding-left: 12pt; }
    .p-foot { margin-top: 20pt; padding-top: 6pt; border-top: 1px solid #c6cfd6; font-size: 8pt; color: #8a98a3; }
  }
</style>

<div class="app">
  <div class="strip" id="roBar" hidden>
    <span><b>只读分享视图</b> — 这是别人分享给你的导图。你可以查看、折叠和导出，但改动不会保存，也不会影响分享者。</span>
    <span class="grow"></span>
    <button class="btn" id="btnFork">复制一份来编辑</button>
  </div>
  <div class="strip" id="webNote" hidden>
    <span><b>提示</b> — 导图保存在你当前这个浏览器里，不会上传到服务器；换设备或清除浏览数据后不保留。需要跨设备请用「备份」导出 JSON，在另一端「导入」。</span>
    <span class="grow"></span>
    <button class="btn sm" id="btnDismissNote">知道了</button>
  </div>

  <div class="bar">
    <div>
      <h1 id="docTitle">Simple Mindmap</h1>
      <div class="sub" id="stats"></div>
    </div>
    <div class="grow"></div>
    <div class="btns">
      <button class="btn" id="btnDrawer" title="打开保存的导图列表">我的导图</button>
      <button class="btn" id="btnSave" title="保存当前导图">保存</button>
      <button class="btn" id="btnShare" title="生成只读分享链接">分享</button>
      <span class="sep"></span>
      <button class="btn" id="btnNew" title="新建一张空白思维导图">新建</button>
      <button class="btn" id="btnImport" title="导入 Markdown 或 JSON 备份">导入</button>
      <button class="btn" id="btnMd" title="导出为 Markdown 文件">导出 MD</button>
      <button class="btn" id="btnBackup" title="下载 JSON 备份（含颜色与折叠状态）">备份</button>
      <span class="sep"></span>
      <button class="btn" id="btnExpand">展开</button>
      <button class="btn" id="btnCollapse">折叠</button>
      <span class="sep" id="sepEdit"></span>
      <button class="btn" id="btnChild">＋ 子节点</button>
      <button class="btn" id="btnSibling">＋ 同级</button>
      <button class="btn danger" id="btnDel">删除</button>
      <span class="sep"></span>
      <button class="btn" id="btnReset" title="载入内置的 EBA 合规规则库示例">载入示例</button>
      <button class="btn primary" id="btnPdf">导出 PDF</button>
    </div>
  </div>

  <div class="strip" id="sharePanel" hidden>
    <span>只读链接</span>
    <input id="shareUrl" readonly aria-label="只读分享链接">
    <button class="btn sm" id="btnCopyShare">复制</button>
    <span id="shareSize"></span>
    <button class="btn sm" id="btnCloseShare">关闭</button>
  </div>

  <div class="hint" id="hintBar">
    <span>
      <b>双击</b> 编辑 ·
      <b>拖动</b> 节点可换父级、调顺序，拖到中心节点左半边即移到左侧 ·
      <b>Tab</b> 子节点 ·
      <b>Enter</b> 同级 ·
      <b>Delete</b> 删除
    </span>
    <span class="grow"></span>
    <span class="pal" id="palette">
      <span class="pal-label">所选分支颜色</span>
    </span>
  </div>

  <div class="body">
    <aside class="drawer closed" id="drawer">
      <div class="drawer-head">
        <h2>我的导图</h2>
        <span class="grow"></span>
        <button class="btn sm" id="btnSaveAs" title="把当前导图另存为一条新记录">另存为</button>
      </div>
      <div class="drawer-note" id="drawerNote"></div>
      <ul class="doc-list" id="docList"></ul>
    </aside>
    <div class="canvas" id="canvas"><div id="tree"></div></div>
  </div>
</div>

<input type="file" id="fileInput" accept=".md,.markdown,.txt,.json" hidden>
<div id="toast" role="status"></div>
<div id="printDoc"></div>

<script>
(function () {
  "use strict";

  var DEFAULT = ["EBA Compliance Rule Library", [
    ["A. 规则来源与优先级", [
      ["National Employment Standards (NES)", [["最低法定权益"], ["最大周工时与灵活安排"], ["法定休假与公共假期"], ["终止通知与冗员"]]],
      ["Modern Award / Award coverage", [["适用性与排除"], ["分类与最低工资"], ["Award 与 EBA 对照基线"], ["Better Off Overall Test 基准"]]],
      ["Enterprise Agreement (EBA)", [["覆盖范围与适用员工"], ["名词定义与解释"], ["名义届满日与版本"], ["条款、附件、工资表及当地安排"]]],
      ["Employment contract", [["合同高于最低标准的个人权益"], ["岗位、地点、薪酬与工时约定"], ["固定期限及特殊条款"]]],
      ["Policies / procedures / custom & practice", [["企业政策"], ["操作程序与 SOP"], ["已形成惯例"], ["管理层书面批准的例外"]]],
      ["Legislation & external obligations", [["Fair Work Act / Regulations"], ["Superannuation Guarantee"], ["Taxation / PAYG / STP"], ["State payroll tax / long service leave / workers compensation"], ["Privacy / record keeping / right to disconnect"]]]
    ]],
    ["B. Coverage & employee classification", [
      ["Coverage determination", [["Legal entity / ABN"], ["Employing company"], ["Work location / state"], ["Business unit / function"], ["Employee cohort / excluded role"]]],
      ["Employment status", [["Permanent full-time"], ["Permanent part-time"], ["Casual"], ["Fixed-term / maximum-term"], ["Apprentice / trainee / junior"]]],
      ["Classification", [["Job family / job profile"], ["Grade / level / band"], ["Skill, licence and competency"], ["Higher duties / acting classification"], ["Progression and reclassification"]]]
    ]],
    ["C. Working time & attendance", [
      ["Ordinary hours", [["Daily / weekly ordinary hours"], ["Span of hours"], ["Roster cycle / averaging period"], ["Full-time and part-time patterns"], ["Minimum engagement"]]],
      ["Roster governance", [["Roster publication notice"], ["Roster change notice"], ["Employee consultation"], ["Shift start/end and handover"], ["Make-up time / flex arrangements"]]],
      ["Breaks & rest", [["Meal break entitlement"], ["Paid rest break"], ["Break timing window"], ["Rest between shifts"], ["Missed or interrupted break consequence"]]],
      ["Overtime triggers", [["Daily threshold"], ["Weekly / cycle threshold"], ["Outside span"], ["Rostered day off"], ["Recall / call-back / remote call"]]],
      ["Availability controls", [["On-call / standby"], ["Right to disconnect"], ["Reasonable additional hours"], ["Fatigue and maximum shift length"]]]
    ]],
    ["D. Pay, penalties & allowances", [
      ["Base remuneration", [["Minimum rate by classification"], ["Annualised salary / loaded rate"], ["Casual loading"], ["Apprentice / junior rate"], ["Salary absorption / set-off"]]],
      ["Penalty rates", [["Afternoon / night shift"], ["Permanent night shift"], ["Saturday / Sunday"], ["Public holiday"], ["Early start / late finish"]]],
      ["Overtime calculation"]
    ]]
  ]];

  /* comfortable mainstream colors; hex values live in CSS vars per theme */
  var PALETTE = [
    { k: "teal",   n: "青绿" },
    { k: "blue",   n: "蓝" },
    { k: "indigo", n: "靛蓝" },
    { k: "steel",  n: "青蓝" },
    { k: "green",  n: "绿" },
    { k: "orange", n: "橙" },
    { k: "coral",  n: "珊瑚红" },
    { k: "plum",   n: "梅红" },
    { k: "purple", n: "紫" },
    { k: "slate",  n: "灰蓝" }
  ];
  var DEFAULT_KEYS = ["teal", "indigo", "orange", "plum", "green", "purple"];
  var PRINT_HEX = {
    teal: "#0e7c7b", blue: "#2f6db4", indigo: "#4a5899", steel: "#2b7a94",
    green: "#557a46", orange: "#b26a2b", coral: "#b3463c", plum: "#96496b",
    purple: "#7d5ba6", slate: "#5b6b78"
  };

  var STORE = "simplemindmap-v1";
  var LEGACY_STORE = "eba-mindmap-v1";
  var LIB_STORE = "simplemindmap-library-v1";
  var ACTIVE_STORE = "simplemindmap-active-v1";
  var NOTE_STORE = "simplemindmap-note-dismissed-v1";
  /* share links from the desktop app point at the published web build */
  var SHARE_BASE = "https://thundom.github.io/simplemindmap/";

  var IS_DESKTOP = !!(window.desktop && window.desktop.list);
  var readOnly = false;
  var desktopFolder = "";
  var uid = 0;

  function build(arr) {
    var n = { id: "n" + (uid++), text: arr[0], collapsed: false, children: [] };
    (arr[1] || []).forEach(function (c) { n.children.push(build(c)); });
    return n;
  }
  function revive(o) {
    o.id = "n" + (uid++);
    if (typeof o.text !== "string") o.text = String(o.text || "节点");
    if (!Array.isArray(o.children)) o.children = [];
    o.children.forEach(revive);
    return o;
  }

  var root;
  try {
    /* fall back to the pre-rename key so existing work survives the upgrade */
    var saved = localStorage.getItem(STORE) || localStorage.getItem(LEGACY_STORE);
    root = saved ? revive(JSON.parse(saved)) : build(DEFAULT);
  } catch (e) { root = build(DEFAULT); }

  var library = [];
  var activeDocId = null;
  try { activeDocId = localStorage.getItem(ACTIVE_STORE) || null; } catch (e) { activeDocId = null; }

  var selectedId = root.id;
  var pending = null;   /* two-click confirmation token */

  function stripIds(node) {
    return JSON.parse(JSON.stringify(node, function (k, v) {
      return k === "id" ? undefined : v;
    }));
  }
  function save() {
    if (readOnly) return;   /* never let a shared view overwrite the viewer's own work */
    try { localStorage.setItem(STORE, JSON.stringify(stripIds(root))); }
    catch (e) { /* storage unavailable — session-only */ }
  }
  function persistActive() {
    try {
      if (activeDocId) localStorage.setItem(ACTIVE_STORE, activeDocId);
      else localStorage.removeItem(ACTIVE_STORE);
    } catch (e) { /* best effort */ }
  }

  function findNode(id, node, parent) {
    node = node || root; parent = parent || null;
    if (node.id === id) return { node: node, parent: parent };
    for (var i = 0; i < node.children.length; i++) {
      var r = findNode(id, node.children[i], node);
      if (r) return r;
    }
    return null;
  }
  function countNodes(n) {
    return 1 + (n.children || []).reduce(function (s, c) { return s + countNodes(c); }, 0);
  }
  function contains(ancestor, node) {
    if (ancestor === node) return true;
    return ancestor.children.some(function (c) { return contains(c, node); });
  }
  function childKey(child, parentDepth, parentKey, idx) {
    if (child.color && PRINT_HEX[child.color]) return child.color;
    if (parentDepth === 0) return DEFAULT_KEYS[idx % DEFAULT_KEYS.length];
    return parentKey;
  }
  function confirmTwice(token, msg) {
    if (pending === token) { pending = null; return true; }
    pending = token;
    toast(msg);
    setTimeout(function () { if (pending === token) pending = null; }, 4000);
    return false;
  }
  function reduceMotion() {
    return window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  }
  function guard() {
    if (readOnly) { toast("只读分享视图，请先点「复制一份来编辑」"); return true; }
    return false;
  }

  /* ---------- render ---------- */
  var treeEl = document.getElementById("tree");
  var canvasEl = document.getElementById("canvas");
  var toastEl = document.getElementById("toast");
  var toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 2600);
  }

  /* FLIP: record card positions in content space, then glide them to new spots */
  function snapshot() {
    if (reduceMotion()) return null;
    var m = {};
    treeEl.querySelectorAll(".card").forEach(function (c) {
      var r = c.getBoundingClientRect();
      m[c.dataset.id] = { x: r.left + canvasEl.scrollLeft, y: r.top + canvasEl.scrollTop };
    });
    return m;
  }
  function flip(prev) {
    if (!prev || reduceMotion()) return;
    treeEl.querySelectorAll(".card").forEach(function (c) {
      var r = c.getBoundingClientRect();
      var now = { x: r.left + canvasEl.scrollLeft, y: r.top + canvasEl.scrollTop };
      var p = prev[c.dataset.id];
      if (p) {
        var dx = p.x - now.x, dy = p.y - now.y;
        if (Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5) {
          c.animate(
            [{ transform: "translate(" + dx + "px," + dy + "px)" }, { transform: "none" }],
            { duration: 300, easing: "cubic-bezier(0.4, 0, 0.2, 1)" }
          );
        }
      } else {
        c.animate(
          [{ opacity: 0, transform: "scale(0.88)" }, { opacity: 1, transform: "none" }],
          { duration: 260, easing: "cubic-bezier(0.2, 0.7, 0.3, 1)" }
        );
      }
    });
  }
  function fadeLines() {
    if (reduceMotion()) return;
    treeEl.querySelectorAll(".branch").forEach(function (b) {
      b.animate([{ opacity: 0.15 }, { opacity: 1 }], { duration: 300, easing: "ease-out" });
    });
  }
  function animatedRender() {
    var prev = snapshot();
    render();
    flip(prev);
    fadeLines();
  }

  function makeCard(node, depth, key) {
    var card = document.createElement("div");
    card.className = "card depth-" + depth + (depth === 0 ? " root" : "");
    card.dataset.id = node.id;
    if (key) card.style.setProperty("--bc", "var(--c-" + key + ")");
    if (node.id === selectedId) card.classList.add("selected");
    card.tabIndex = 0;
    if (depth > 0 && !readOnly) card.draggable = true;

    var txt = document.createElement("span");
    txt.className = "txt";
    txt.textContent = node.text;
    card.appendChild(txt);

    if (node.children.length) {
      var tg = document.createElement("button");
      tg.className = "toggle";
      tg.title = node.collapsed ? "展开" : "折叠";
      tg.textContent = node.collapsed ? String(countNodes(node) - 1) : "−";
      tg.draggable = false;
      tg.addEventListener("click", function (e) {
        e.stopPropagation();
        node.collapsed = !node.collapsed;
        save(); animatedRender();
      });
      card.appendChild(tg);
    }

    if (!readOnly) {
      var ops = document.createElement("span");
      ops.className = "ops";
      var addBtn = document.createElement("button");
      addBtn.className = "op"; addBtn.textContent = "+"; addBtn.title = "添加子节点";
      addBtn.addEventListener("click", function (e) { e.stopPropagation(); addChild(node.id); });
      ops.appendChild(addBtn);
      if (depth > 0) {
        var delBtn = document.createElement("button");
        delBtn.className = "op del"; delBtn.textContent = "×"; delBtn.title = "删除节点";
        delBtn.addEventListener("click", function (e) { e.stopPropagation(); removeNode(node.id); });
        ops.appendChild(delBtn);
      }
      card.appendChild(ops);

      var dz = document.createElement("i");
      dz.className = "dz";
      card.appendChild(dz);
    }

    card.addEventListener("click", function () { select(node.id); });
    card.addEventListener("dblclick", function () { startEdit(node.id); });
    card.addEventListener("keydown", onCardKey);
    if (!readOnly) wireDrag(card, node, depth);
    return card;
  }

  function renderNode(node, depth, key) {
    var row = document.createElement("div");
    row.className = "row";
    var card = makeCard(node, depth, key);
    row.appendChild(card);

    if (node.children.length && !node.collapsed) {
      card.classList.add("open");
      var kids = document.createElement("div");
      kids.className = "kids";
      node.children.forEach(function (c, i) {
        var ck = childKey(c, depth, key, i);
        var b = document.createElement("div");
        b.className = "branch";
        if (ck) b.style.setProperty("--bc", "var(--c-" + ck + ")");
        b.appendChild(renderNode(c, depth + 1, ck));
        kids.appendChild(b);
      });
      row.appendChild(kids);
    }
    return row;
  }

  /* root sits between its left-hand and right-hand branches */
  function renderRoot() {
    var row = document.createElement("div");
    row.className = "row";
    var card = makeCard(root, 0, null);

    function sideKids(side, mirrored) {
      var kids = document.createElement("div");
      kids.className = "kids" + (mirrored ? " mirror" : "");
      var any = false;
      root.children.forEach(function (c, i) {
        if ((c.side === "left") !== (side === "left")) return;
        any = true;
        var ck = childKey(c, 0, null, i);
        var b = document.createElement("div");
        b.className = "branch";
        b.style.setProperty("--bc", "var(--c-" + ck + ")");
        b.appendChild(renderNode(c, 1, ck));
        kids.appendChild(b);
      });
      return any ? kids : null;
    }

    if (!root.collapsed) {
      var left = sideKids("left", true);
      var right = sideKids("right", false);
      if (left) { row.appendChild(left); card.classList.add("open-left"); }
      row.appendChild(card);
      if (right) { row.appendChild(right); card.classList.add("open"); }
      return row;
    }
    row.appendChild(card);
    return row;
  }

  function render() {
    treeEl.textContent = "";
    treeEl.appendChild(renderRoot());
    document.getElementById("stats").textContent =
      root.text + " · 共 " + countNodes(root) + " 个节点 · " + root.children.length + " 个一级分支";
    document.title = root.text + " · Simple Mindmap";
    updatePalette();
  }

  function select(id) {
    selectedId = id;
    var prev = treeEl.querySelector(".card.selected");
    if (prev) prev.classList.remove("selected");
    var el = cardEl(id);
    if (el) { el.classList.add("selected"); el.focus(); }
    updatePalette();
  }
  function cardEl(id) {
    return treeEl.querySelector('.card[data-id="' + id + '"]');
  }

  /* ---------- drag & drop ---------- */
  var dragId = null;

  function clearDz() {
    treeEl.querySelectorAll(".card").forEach(function (c) {
      c.classList.remove("dz-before", "dz-after", "dz-child", "dz-side-left", "dz-side-right");
    });
  }
  function dropMode(card, node, depth, e) {
    var r = card.getBoundingClientRect();
    if (depth === 0) return e.clientX < r.left + r.width / 2 ? "side-left" : "side-right";
    var f = (e.clientY - r.top) / r.height;
    if (f < 0.28) return "before";
    if (f > 0.72) return "after";
    return "child";
  }

  function wireDrag(card, node, depth) {
    if (depth > 0) {
      card.addEventListener("dragstart", function (e) {
        dragId = node.id;
        card.classList.add("dragging");
        e.dataTransfer.effectAllowed = "move";
        try { e.dataTransfer.setData("text/plain", node.id); } catch (err) { /* guard */ }
      });
      card.addEventListener("dragend", function () {
        dragId = null;
        card.classList.remove("dragging");
        clearDz();
      });
    }
    card.addEventListener("dragover", function (e) {
      if (!dragId || dragId === node.id) return;
      var src = findNode(dragId);
      if (!src || contains(src.node, node)) return;   /* no dropping into own subtree */
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      var mode = dropMode(card, node, depth, e);
      clearDz();
      card.classList.add("dz-" + mode);
    });
    card.addEventListener("dragleave", function () {
      card.classList.remove("dz-before", "dz-after", "dz-child", "dz-side-left", "dz-side-right");
    });
    card.addEventListener("drop", function (e) {
      if (!dragId || dragId === node.id) return;
      e.preventDefault();
      var mode = dropMode(card, node, depth, e);
      clearDz();
      moveNode(dragId, node.id, mode);
    });
  }

  function moveNode(srcId, targetId, mode) {
    if (guard()) return;
    var src = findNode(srcId), tgt = findNode(targetId);
    if (!src || !tgt || !src.parent) return;
    if (contains(src.node, tgt.node)) { toast("不能把节点移动到它自己的子树里"); return; }

    var prev = snapshot();
    src.parent.children.splice(src.parent.children.indexOf(src.node), 1);

    if (mode === "side-left" || mode === "side-right") {
      if (mode === "side-left") src.node.side = "left"; else delete src.node.side;
      root.collapsed = false;
      root.children.push(src.node);
    } else if (mode === "child") {
      delete src.node.side;
      tgt.node.collapsed = false;
      tgt.node.children.push(src.node);
    } else {
      var siblings = tgt.parent.children;
      var at = siblings.indexOf(tgt.node) + (mode === "after" ? 1 : 0);
      if (tgt.parent === root) {
        if (tgt.node.side === "left") src.node.side = "left"; else delete src.node.side;
      } else {
        delete src.node.side;
      }
      siblings.splice(at, 0, src.node);
    }

    selectedId = src.node.id;
    save(); render(); flip(prev); fadeLines();
    toast("已移动「" + src.node.text + "」");
  }

  /* ---------- color palette ---------- */
  var palEl = document.getElementById("palette");
  PALETTE.forEach(function (p) {
    var sw = document.createElement("button");
    sw.className = "sw";
    sw.dataset.key = p.k;
    sw.title = p.n;
    sw.setAttribute("aria-label", "颜色：" + p.n);
    sw.style.setProperty("--sc", "var(--c-" + p.k + ")");
    sw.addEventListener("click", function () { applyColor(p.k); });
    palEl.appendChild(sw);
  });
  var clearBtn = document.createElement("button");
  clearBtn.className = "sw-clear";
  clearBtn.textContent = "默认";
  clearBtn.title = "恢复默认 / 跟随上级颜色";
  clearBtn.addEventListener("click", function () { applyColor(null); });
  palEl.appendChild(clearBtn);

  function applyColor(key) {
    if (guard()) return;
    var r = findNode(selectedId);
    if (!r || !r.parent) { toast("请先选中一个分支节点（根节点不着色）"); return; }
    if (key) r.node.color = key; else delete r.node.color;
    save(); render();
  }
  function updatePalette() {
    var r = findNode(selectedId);
    var cur = (r && r.node.color) || null;
    palEl.querySelectorAll(".sw").forEach(function (sw) {
      sw.classList.toggle("cur", sw.dataset.key === cur);
    });
    clearBtn.classList.toggle("cur", !cur);
  }

  /* ---------- editing ---------- */
  function startEdit(id) {
    if (readOnly) return;
    var el = cardEl(id);
    if (!el) return;
    var txt = el.querySelector(".txt");
    var r = findNode(id);
    el.draggable = false;
    txt.contentEditable = "true";
    txt.focus();
    var range = document.createRange();
    range.selectNodeContents(txt);
    var sel = window.getSelection();
    sel.removeAllRanges(); sel.addRange(range);

    var done = false;
    function commit(cancel) {
      if (done) return;   /* Enter/Escape commit directly; the later blur must not undo it */
      done = true;
      txt.contentEditable = "false";
      var v = txt.textContent.replace(/\s+/g, " ").trim();
      if (!cancel && v) { r.node.text = v; save(); }
      render();
    }
    txt.addEventListener("blur", function () { commit(false); });
    txt.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); commit(false); }
      else if (e.key === "Escape") { e.preventDefault(); commit(true); }
      e.stopPropagation();
    });
  }

  /* ---------- structure ops ---------- */
  function addChild(id) {
    if (guard()) return;
    var r = findNode(id || selectedId);
    if (!r) return;
    var n = { id: "n" + (uid++), text: "新节点", collapsed: false, children: [] };
    r.node.collapsed = false;
    r.node.children.push(n);
    selectedId = n.id;
    save(); animatedRender(); startEdit(n.id);
  }
  function addSibling(id) {
    if (guard()) return;
    var r = findNode(id || selectedId);
    if (!r) return;
    if (!r.parent) { addChild(root.id); return; }
    var n = { id: "n" + (uid++), text: "新节点", collapsed: false, children: [] };
    if (r.parent === root && r.node.side === "left") n.side = "left";
    var idx = r.parent.children.indexOf(r.node);
    r.parent.children.splice(idx + 1, 0, n);
    selectedId = n.id;
    save(); animatedRender(); startEdit(n.id);
  }
  function removeNode(id) {
    if (guard()) return;
    id = id || selectedId;
    var r = findNode(id);
    if (!r) return;
    if (!r.parent) { toast("根节点不能删除"); return; }
    var kids = countNodes(r.node) - 1;
    if (kids > 0 && !confirmTwice("del:" + id, "该节点含 " + kids + " 个子节点，再次点击删除以确认")) return;
    var idx = r.parent.children.indexOf(r.node);
    r.parent.children.splice(idx, 1);
    selectedId = r.parent.children[Math.min(idx, r.parent.children.length - 1)]
      ? r.parent.children[Math.min(idx, r.parent.children.length - 1)].id
      : r.parent.id;
    save(); animatedRender();
    toast("已删除「" + r.node.text + "」");
  }
  function setAll(node, collapsed) {
    if (node.children.length) node.collapsed = collapsed;
    node.children.forEach(function (c) { setAll(c, collapsed); });
  }

  function onCardKey(e) {
    if (readOnly) return;
    var id = e.currentTarget.dataset.id;
    if (e.key === "Tab") { e.preventDefault(); addChild(id); }
    else if (e.key === "Enter") { e.preventDefault(); addSibling(id); }
    else if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); removeNode(id); }
    else if (e.key === "F2" || e.key === " ") { e.preventDefault(); startEdit(id); }
  }

  /* ---------- saved-document library (files on desktop, localStorage on web) ---------- */
  var drawerEl = document.getElementById("drawer");
  var docListEl = document.getElementById("docList");
  var noteEl = document.getElementById("drawerNote");
  var btnDrawer = document.getElementById("btnDrawer");

  function stamp(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return "";
    var p = function (n) { return String(n).padStart(2, "0"); };
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) +
      " " + p(d.getHours()) + ":" + p(d.getMinutes());
  }
  function openDrawer() {
    drawerEl.classList.remove("closed");
    btnDrawer.classList.add("on");
  }

  function libLoad() {
    if (IS_DESKTOP) {
      return window.desktop.list().then(function (docs) {
        library = Array.isArray(docs) ? docs : [];
        renderLibrary();
      }, function () {
        library = []; renderLibrary();
        toast("读取保存目录失败，请检查该位置是否存在");
      });
    }
    try { library = JSON.parse(localStorage.getItem(LIB_STORE)) || []; } catch (e) { library = []; }
    if (!Array.isArray(library)) library = [];
    renderLibrary();
    return Promise.resolve();
  }
  function libPersistWeb() {
    try { localStorage.setItem(LIB_STORE, JSON.stringify(library)); }
    catch (e) { toast("浏览器存储空间不足，未能保存"); }
    persistActive();
  }

  function renderDrawerNote() {
    noteEl.textContent = "";
    if (IS_DESKTOP) {
      var lab = document.createElement("span");
      lab.className = "folder-label";
      lab.textContent = "保存位置";
      var p = document.createElement("code");
      p.className = "folder-path";
      p.textContent = desktopFolder || "读取中…";
      var acts = document.createElement("div");
      acts.className = "folder-acts";
      var change = document.createElement("button");
      change.className = "btn sm"; change.textContent = "更改位置";
      change.addEventListener("click", function () {
        window.desktop.pickFolder().then(function (res) {
          desktopFolder = res.folder;
          renderDrawerNote();
          if (res.changed) { activeDocId = null; persistActive(); toast("保存位置已改为 " + res.folder); }
          libLoad();
        }, function () { toast("无法打开文件夹选择器"); });
      });
      var open = document.createElement("button");
      open.className = "btn sm"; open.textContent = "打开文件夹";
      open.addEventListener("click", function () { window.desktop.reveal(); });
      acts.appendChild(change); acts.appendChild(open);
      noteEl.appendChild(lab); noteEl.appendChild(p); noteEl.appendChild(acts);
      return;
    }
    noteEl.textContent = "保存在本浏览器中，不上传服务器。换设备或清除浏览数据后不保留——重要内容请用「备份」导出 JSON。";
  }

  function renderLibrary() {
    renderDrawerNote();
    docListEl.textContent = "";
    if (!library.length) {
      var li = document.createElement("li");
      li.className = "empty";
      li.textContent = IS_DESKTOP
        ? "这个文件夹里还没有导图。点「保存」把当前这张存成 .json 文件。"
        : "还没有保存的导图。点「保存」把当前这张存进来。";
      docListEl.appendChild(li);
      return;
    }
    library.slice().sort(function (a, b) { return (b.savedAt || "").localeCompare(a.savedAt || ""); })
      .forEach(function (doc) {
        var li = document.createElement("li");
        li.className = "doc" + (doc.id === activeDocId ? " active" : "");
        li.title = IS_DESKTOP ? doc.file : "点击打开这张导图";

        var name = document.createElement("div");
        name.className = "doc-name";
        name.textContent = doc.name;
        li.appendChild(name);

        var meta = document.createElement("div");
        meta.className = "doc-meta";
        var when = document.createElement("span");
        when.textContent = stamp(doc.savedAt) + " · " + countNodes(doc.tree) + " 节点";
        meta.appendChild(when);

        var acts = document.createElement("span");
        acts.className = "doc-acts";
        var ren = document.createElement("button");
        ren.className = "doc-act"; ren.textContent = "重命名";
        ren.addEventListener("click", function (e) { e.stopPropagation(); renameDoc(doc, name); });
        var del = document.createElement("button");
        del.className = "doc-act del"; del.textContent = "删除";
        del.addEventListener("click", function (e) { e.stopPropagation(); deleteDoc(doc); });
        acts.appendChild(ren); acts.appendChild(del);
        meta.appendChild(acts);
        li.appendChild(meta);

        li.addEventListener("click", function () { openDoc(doc); });
        docListEl.appendChild(li);
      });
  }

  function openDoc(doc) {
    root = revive(JSON.parse(JSON.stringify(doc.tree)));
    selectedId = root.id;
    activeDocId = doc.id;
    if (readOnly) exitReadOnly();
    persistActive(); save(); render(); renderLibrary();
    toast("已打开「" + doc.name + "」");
  }
  function renameDoc(doc, nameEl) {
    nameEl.contentEditable = "true";
    nameEl.focus();
    var range = document.createRange();
    range.selectNodeContents(nameEl);
    var sel = window.getSelection();
    sel.removeAllRanges(); sel.addRange(range);
    var done = false;
    function commit(cancel) {
      if (done) return;
      done = true;
      nameEl.contentEditable = "false";
      var v = nameEl.textContent.replace(/\s+/g, " ").trim();
      if (cancel || !v || v === doc.name) { renderLibrary(); return; }
      if (IS_DESKTOP) {
        window.desktop.rename(doc.file, v).then(function (res) {
          if (activeDocId === doc.id) { activeDocId = res.file; persistActive(); }
          libLoad();
          toast("已重命名为「" + v + "」");
        }, function () { toast("重命名失败"); libLoad(); });
        return;
      }
      doc.name = v;
      libPersistWeb(); renderLibrary();
    }
    nameEl.addEventListener("blur", function () { commit(false); });
    nameEl.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); commit(false); }
      else if (e.key === "Escape") { e.preventDefault(); commit(true); }
      e.stopPropagation();
    });
  }
  function deleteDoc(doc) {
    if (!confirmTwice("doc:" + doc.id, "确定删除「" + doc.name + "」？再次点击确认")) return;
    if (activeDocId === doc.id) activeDocId = null;
    if (IS_DESKTOP) {
      window.desktop.remove(doc.file).then(function (res) {
        persistActive(); libLoad();
        toast(res && res.trashed ? "已移到回收站：" + doc.name : "已删除文件：" + doc.name);
      }, function () { toast("删除文件失败"); libLoad(); });
      return;
    }
    library = library.filter(function (d) { return d.id !== doc.id; });
    libPersistWeb(); renderLibrary();
    toast("已删除「" + doc.name + "」");
  }
  function saveDoc(asNew) {
    if (guard()) return;
    var existing = !asNew && activeDocId
      ? library.filter(function (d) { return d.id === activeDocId; })[0]
      : null;

    if (IS_DESKTOP) {
      var file = existing ? existing.file : null;
      var name = existing ? existing.name : root.text;
      window.desktop.write(file, name, stripIds(root)).then(function (res) {
        activeDocId = res.file;
        persistActive(); libLoad(); openDrawer();
        toast(existing ? "已更新「" + name + "」" : "已保存为 " + res.file);
      }, function () { toast("写入文件失败，请检查保存位置的权限"); });
      return;
    }

    if (existing) {
      existing.tree = stripIds(root);
      existing.savedAt = new Date().toISOString();
      libPersistWeb(); renderLibrary();
      toast("已更新「" + existing.name + "」");
      return;
    }
    var doc = {
      id: "d" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      name: root.text,
      savedAt: new Date().toISOString(),
      tree: stripIds(root)
    };
    library.push(doc);
    activeDocId = doc.id;
    libPersistWeb(); renderLibrary(); openDrawer();
    toast("已保存「" + doc.name + "」到我的导图");
  }

  btnDrawer.addEventListener("click", function () {
    var open = drawerEl.classList.toggle("closed") === false;
    btnDrawer.classList.toggle("on", open);
  });
  document.getElementById("btnSave").addEventListener("click", function () { saveDoc(false); });
  document.getElementById("btnSaveAs").addEventListener("click", function () { saveDoc(true); });

  /* ---------- read-only sharing via the URL fragment ---------- */
  function b64url(bytes) {
    var s = "";
    for (var i = 0; i < bytes.length; i += 0x8000) {
      s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  function unb64url(s) {
    s = s.replace(/-/g, "+").replace(/_/g, "/");
    while (s.length % 4) s += "=";
    var bin = atob(s);
    var out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function encodeShare(tree) {
    var bytes = new TextEncoder().encode(JSON.stringify(tree));
    if (typeof CompressionStream !== "function") {
      return Promise.resolve("s0." + b64url(bytes));
    }
    var stream = new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate-raw"));
    return new Response(stream).arrayBuffer().then(function (buf) {
      return "s1." + b64url(new Uint8Array(buf));
    });
  }
  function decodeShare(frag) {
    var m = /^s([01])\.([A-Za-z0-9\-_]+)$/.exec(frag);
    if (!m) return Promise.resolve(null);
    var bytes;
    try { bytes = unb64url(m[2]); } catch (e) { return Promise.resolve(null); }
    var text;
    if (m[1] === "0") {
      text = Promise.resolve(new TextDecoder().decode(bytes));
    } else {
      if (typeof DecompressionStream !== "function") return Promise.resolve(null);
      var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
      text = new Response(stream).arrayBuffer().then(function (buf) {
        return new TextDecoder().decode(buf);
      });
    }
    return text.then(function (json) {
      var t = JSON.parse(json);
      return (t && typeof t.text === "string") ? t : null;
    }).catch(function () { return null; });
  }

  var sharePanel = document.getElementById("sharePanel");
  var shareUrlEl = document.getElementById("shareUrl");

  function copyText(s) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(s).then(function () { return true; }, function () { return legacyCopy(); });
    }
    return Promise.resolve(legacyCopy());
  }
  function legacyCopy() {
    try {
      shareUrlEl.select();
      shareUrlEl.setSelectionRange(0, 999999);
      return document.execCommand("copy");
    } catch (e) { return false; }
  }

  document.getElementById("btnShare").addEventListener("click", function () {
    encodeShare(stripIds(root)).then(function (frag) {
      var base = /^https?:$/.test(location.protocol)
        ? location.href.split("#")[0]
        : SHARE_BASE;
      var url = base + "#" + frag;
      shareUrlEl.value = url;
      document.getElementById("shareSize").textContent = url.length.toLocaleString() + " 字符";
      sharePanel.hidden = false;
      shareUrlEl.focus(); shareUrlEl.select();
      copyText(url).then(function (ok) {
        if (url.length > 8000) {
          toast("链接已生成但较长（" + url.length + " 字符），部分聊天工具可能截断，必要时改用 JSON 备份");
        } else {
          toast(ok ? "只读链接已复制到剪贴板" : "链接已生成，请手动复制");
        }
      });
    }, function () { toast("生成分享链接失败"); });
  });
  document.getElementById("btnCopyShare").addEventListener("click", function () {
    copyText(shareUrlEl.value).then(function (ok) { toast(ok ? "已复制" : "复制失败，请手动选择复制"); });
  });
  document.getElementById("btnCloseShare").addEventListener("click", function () { sharePanel.hidden = true; });

  function exitReadOnly() {
    readOnly = false;
    document.body.classList.remove("ro");
    if (location.hash) {
      history.replaceState(null, "", location.pathname + location.search);
    }
    applyMode();
  }
  document.getElementById("btnFork").addEventListener("click", function () {
    exitReadOnly();
    activeDocId = null;
    persistActive(); save(); render();
    toast("已转为可编辑副本，点「保存」可存进我的导图");
  });

  /* ---------- mode wiring ---------- */
  function applyMode() {
    document.body.classList.toggle("ro", readOnly);
    document.getElementById("roBar").hidden = !readOnly;
    document.getElementById("hintBar").hidden = readOnly;
    ["btnSave", "btnSaveAs", "btnNew", "btnImport", "btnChild", "btnSibling", "btnDel", "btnReset", "sepEdit"]
      .forEach(function (id) { document.getElementById(id).hidden = readOnly; });

    var noteDismissed = false;
    try { noteDismissed = localStorage.getItem(NOTE_STORE) === "1"; } catch (e) { /* ignore */ }
    document.getElementById("webNote").hidden = IS_DESKTOP || readOnly || noteDismissed;
  }
  document.getElementById("btnDismissNote").addEventListener("click", function () {
    document.getElementById("webNote").hidden = true;
    try { localStorage.setItem(NOTE_STORE, "1"); } catch (e) { /* ignore */ }
  });

  /* ---------- file: new / import / export ---------- */
  function download(name, text, type) {
    var blob = new Blob([text], { type: type || "text/plain;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }
  function fileStamp() {
    var d = new Date();
    return d.getFullYear() + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0");
  }
  function safeName(s) {
    var v = s.replace(/[\\/:*?"<>|#]/g, "").trim().slice(0, 40);
    return v || "mindmap";
  }

  function toMarkdown() {
    var lines = ["# " + root.text, ""];
    function walk(n, depth) {
      lines.push("  ".repeat(depth) + "- " + n.text);
      n.children.forEach(function (c) { walk(c, depth + 1); });
    }
    root.children.forEach(function (c) { walk(c, 0); });
    return lines.join("\n") + "\n";
  }

  function parseMarkdown(text) {
    var lines = text.split(/\r?\n/);
    var rootText = null;
    var items = [];
    lines.forEach(function (ln) {
      var h = ln.match(/^#{1,2}\s+(.+)/);
      if (h && rootText === null && items.length === 0) { rootText = h[1].trim(); return; }
      var m = ln.match(/^([ \t]*)[-*+]\s+(.+)/);
      if (m) items.push({ indent: m[1].replace(/\t/g, "  ").length, text: m[2].trim() });
    });
    if (!items.length) return null;
    var unit = null;
    items.forEach(function (it) {
      if (it.indent > 0 && (unit === null || it.indent < unit)) unit = it.indent;
    });
    unit = unit || 2;
    var r = { id: "n" + (uid++), text: rootText || "导入的思维导图", collapsed: false, children: [] };
    var stack = [{ node: r, level: -1 }];
    items.forEach(function (it) {
      var level = Math.round(it.indent / unit);
      var n = { id: "n" + (uid++), text: it.text, collapsed: false, children: [] };
      while (stack.length > 1 && stack[stack.length - 1].level >= level) stack.pop();
      stack[stack.length - 1].node.children.push(n);
      stack.push({ node: n, level: level });
    });
    return r;
  }

  function importText(text, name) {
    var tree = null;
    var trimmed = text.replace(/^﻿/, "").trim();
    if (/\.json$/i.test(name) || trimmed.charAt(0) === "{") {
      try {
        var obj = JSON.parse(trimmed);
        var raw = obj.tree || obj;
        if (raw && typeof raw.text === "string") tree = revive(raw);
      } catch (e) { /* fall through to error toast */ }
    } else {
      tree = parseMarkdown(text);
    }
    if (!tree) { toast("无法识别文件内容：需要 Markdown 列表或本应用的 JSON 备份"); return; }
    if (readOnly) exitReadOnly();
    root = tree;
    selectedId = root.id;
    activeDocId = null;
    persistActive(); save(); render(); renderLibrary();
    toast("已导入「" + root.text + "」，共 " + countNodes(root) + " 个节点");
  }

  var fileInput = document.getElementById("fileInput");
  fileInput.addEventListener("change", function () {
    var f = fileInput.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function () { importText(String(reader.result), f.name); };
    reader.onerror = function () { toast("读取文件失败，请重试"); };
    reader.readAsText(f, "utf-8");
    fileInput.value = "";
  });

  document.getElementById("btnNew").addEventListener("click", function () {
    if (guard()) return;
    if (!confirmTwice("NEW", "新建将清空当前画布（可先点「保存」存起来），再次点击确认")) return;
    root = { id: "n" + (uid++), text: "新思维导图", collapsed: false, children: [] };
    selectedId = root.id;
    activeDocId = null;
    persistActive(); save(); render(); renderLibrary(); startEdit(root.id);
  });
  document.getElementById("btnImport").addEventListener("click", function () { fileInput.click(); });
  document.getElementById("btnMd").addEventListener("click", function () {
    download(safeName(root.text) + "-" + fileStamp() + ".md", toMarkdown(), "text/markdown;charset=utf-8");
    toast("已导出 Markdown（不含颜色；完整备份请用 JSON）");
  });
  document.getElementById("btnBackup").addEventListener("click", function () {
    var payload = {
      app: "simplemindmap",
      version: 1,
      name: root.text,
      exportedAt: new Date().toISOString(),
      savedAt: new Date().toISOString(),
      tree: stripIds(root)
    };
    download(safeName(root.text) + "-backup-" + fileStamp() + ".json",
      JSON.stringify(payload, null, 2), "application/json;charset=utf-8");
    toast("已下载 JSON 备份，含颜色与折叠状态");
  });

  /* ---------- toolbar ---------- */
  document.getElementById("btnExpand").addEventListener("click", function () { setAll(root, false); save(); animatedRender(); });
  document.getElementById("btnCollapse").addEventListener("click", function () {
    root.children.forEach(function (c) { setAll(c, true); });
    root.collapsed = false; save(); animatedRender();
  });
  document.getElementById("btnChild").addEventListener("click", function () { addChild(); });
  document.getElementById("btnSibling").addEventListener("click", function () { addSibling(); });
  document.getElementById("btnDel").addEventListener("click", function () { removeNode(); });
  document.getElementById("btnReset").addEventListener("click", function () {
    if (guard()) return;
    if (!confirmTwice("RESET", "将载入内置 EBA 示例并覆盖当前内容，再次点击确认")) return;
    root = build(DEFAULT); selectedId = root.id; activeDocId = null;
    persistActive(); save(); render(); renderLibrary();
    toast("已载入 EBA 合规规则库示例");
  });
  document.getElementById("btnPdf").addEventListener("click", function () {
    buildPrint();
    toast("在打印对话框中选择「另存为 PDF / Save as PDF」");
    setTimeout(function () { window.print(); }, 150);
  });
  window.addEventListener("beforeprint", buildPrint);

  /* ---------- print document ---------- */
  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function leafList(nodes) {
    if (!nodes.length) return "";
    var h = '<ul class="p-ul">';
    nodes.forEach(function (n) {
      h += "<li>" + esc(n.text) + leafList(n.children) + "</li>";
    });
    return h + "</ul>";
  }
  function buildPrint() {
    var d = new Date();
    var date = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    var h = '<div class="p-head"><h1 class="p-title">' + esc(root.text) + "</h1>" +
      '<div class="p-meta"><span>导出日期 ' + date + "</span><span>共 " +
      countNodes(root) + " 个节点 · " + root.children.length + " 个一级分支</span></div></div>";

    root.children.forEach(function (sec, i) {
      var secKey = childKey(sec, 0, null, i);
      h += '<div class="p-sec" style="--pc:' + PRINT_HEX[secKey] + '">' +
        '<h2 class="p-h1">' + esc(sec.text) + "</h2>";
      if (sec.children.length) {
        h += '<div class="p-grid">';
        sec.children.forEach(function (sub, j) {
          var subKey = childKey(sub, 1, secKey, j);
          var style = subKey !== secKey ? ' style="--pc:' + PRINT_HEX[subKey] + '"' : "";
          h += '<div class="p-sub"' + style + '><h3 class="p-h2">' + esc(sub.text) + "</h3>" +
            leafList(sub.children) + "</div>";
        });
        h += "</div>";
      }
      h += "</div>";
    });
    h += '<div class="p-foot">' + esc(root.text) + " · " + date + "</div>";
    document.getElementById("printDoc").innerHTML = h;
  }

  /* ---------- boot ---------- */
  function currentFragment() {
    try { return decodeURIComponent(location.hash.slice(1)); }
    catch (e) { return location.hash.slice(1); }
  }

  /** Load a share payload from the URL. Returns a promise that resolves once handled. */
  function loadShare(frag) {
    return decodeShare(frag).then(function (t) {
      if (!t) {
        toast("分享链接已损坏或不完整，显示的是你自己的导图");
        return false;
      }
      root = revive(t);
      selectedId = root.id;
      readOnly = true;
      sharePanel.hidden = true;
      applyMode();
      render();
      return true;
    });
  }

  /* a share link pasted into an already-open tab only changes the fragment */
  window.addEventListener("hashchange", function () {
    var f = currentFragment();
    if (/^s[01]\./.test(f)) loadShare(f);
    else if (readOnly) exitReadOnly();
  });

  function finishBoot() {
    applyMode();
    render();
    save();   /* completes the migration from LEGACY_STORE on first run */
    if (IS_DESKTOP) {
      window.desktop.folder().then(function (f) { desktopFolder = f; renderDrawerNote(); },
        function () { renderDrawerNote(); });
    }
    libLoad();
  }

  var bootFrag = currentFragment();
  if (/^s[01]\./.test(bootFrag)) {
    loadShare(bootFrag).then(finishBoot, finishBoot);
  } else {
    finishBoot();
  }
})();
</script>
